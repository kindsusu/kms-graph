<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="KMS Graph">
  <title>KMS Graph</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B1F"/><stop offset="1" stop-color="#101A3F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0.9"/><stop offset="0.4" stop-color="#60A5FA" stop-opacity="0.25"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <style>
      .t{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",Helvetica,Arial,sans-serif}
      .lbl{font-size:13px;fill:#A5B4FC;letter-spacing:2px}
      .cat{font-size:13px;fill:#E2E8F0}
    </style>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#sky)"/>

  <g fill="#FFFFFF" opacity="0.35" filter="url(#soft)">
    <circle cx="40" cy="60" r="1"/><circle cx="130" cy="30" r="0.8"/><circle cx="210" cy="95" r="1.1"/><circle cx="330" cy="40" r="0.7"/>
    <circle cx="420" cy="120" r="0.9"/><circle cx="560" cy="35" r="1"/><circle cx="650" cy="90" r="0.8"/><circle cx="760" cy="28" r="1"/>
    <circle cx="1120" cy="60" r="0.9"/><circle cx="1160" cy="150" r="0.7"/><circle cx="1080" cy="340" r="1"/><circle cx="90" cy="330" r="0.8"/>
    <circle cx="300" cy="360" r="1"/><circle cx="480" cy="330" r="0.7"/><circle cx="700" cy="370" r="0.9"/><circle cx="1150" cy="300" r="0.8"/>
    <circle cx="960" cy="40" r="0.8"/><circle cx="880" cy="380" r="0.7"/><circle cx="20" cy="200" r="0.9"/><circle cx="1180" cy="230" r="1"/>
  </g>

  <g fill="none" stroke-width="1.2" stroke-linecap="round">
    <g stroke="#818CF8" stroke-opacity="0.7">
      <polyline points="120,150 175,110 235,135 205,190 120,150"/><line x1="235" y1="135" x2="290" y2="105"/>
    </g>
    <g stroke="#FB7185" stroke-opacity="0.7">
      <polyline points="330,230 390,200 450,235 420,290"/><line x1="390" y1="200" x2="410" y2="150"/>
    </g>
    <g stroke="#FBBF24" stroke-opacity="0.7">
      <polyline points="520,110 590,90 640,140 600,185 540,170 520,110"/>
    </g>
    <g stroke="#2DD4BF" stroke-opacity="0.7">
      <polyline points="560,270 620,250 690,275 730,240"/><line x1="620" y1="250" x2="640" y2="140"/>
    </g>
    <g stroke="#38BDF8" stroke-opacity="0.7">
      <polyline points="760,120 820,95 870,150 830,200 770,180"/><line x1="770" y1="180" x2="730" y2="240"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-dasharray="3 5">
      <line x1="205" y1="190" x2="330" y2="230"/><line x1="290" y1="105" x2="410" y2="150"/><line x1="450" y1="235" x2="540" y2="170"/>
    </g>
  </g>

  <g fill="url(#halo)">
    <circle cx="120" cy="150" r="14"/><circle cx="175" cy="110" r="11"/><circle cx="235" cy="135" r="11"/><circle cx="205" cy="190" r="12"/><circle cx="290" cy="105" r="9"/>
    <circle cx="330" cy="230" r="11"/><circle cx="390" cy="200" r="14"/><circle cx="450" cy="235" r="10"/><circle cx="420" cy="290" r="9"/><circle cx="410" cy="150" r="9"/>
    <circle cx="520" cy="110" r="11"/><circle cx="590" cy="90" r="10"/><circle cx="640" cy="140" r="16"/><circle cx="600" cy="185" r="10"/><circle cx="540" cy="170" r="9"/>
    <circle cx="560" cy="270" r="10"/><circle cx="620" cy="250" r="13"/><circle cx="690" cy="275" r="10"/><circle cx="730" cy="240" r="12"/>
    <circle cx="760" cy="120" r="10"/><circle cx="820" cy="95" r="13"/><circle cx="870" cy="150" r="10"/><circle cx="830" cy="200" r="11"/><circle cx="770" cy="180" r="9"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="120" cy="150" r="3.2"/><circle cx="175" cy="110" r="2.4"/><circle cx="235" cy="135" r="2.4"/><circle cx="205" cy="190" r="2.8"/><circle cx="290" cy="105" r="2"/>
    <circle cx="330" cy="230" r="2.4"/><circle cx="390" cy="200" r="3.2"/><circle cx="450" cy="235" r="2.2"/><circle cx="420" cy="290" r="2"/><circle cx="410" cy="150" r="2"/>
    <circle cx="520" cy="110" r="2.4"/><circle cx="590" cy="90" r="2.2"/><circle cx="640" cy="140" r="3.6"/><circle cx="600" cy="185" r="2.2"/><circle cx="540" cy="170" r="2"/>
    <circle cx="560" cy="270" r="2.2"/><circle cx="620" cy="250" r="3"/><circle cx="690" cy="275" r="2.2"/><circle cx="730" cy="240" r="2.8"/>
    <circle cx="760" cy="120" r="2.2"/><circle cx="820" cy="95" r="3"/><circle cx="870" cy="150" r="2.2"/><circle cx="830" cy="200" r="2.4"/><circle cx="770" cy="180" r="2"/>
  </g>

  <g class="t lbl">
    <text x="150" y="222">인사</text>
    <text x="356" y="316">채용</text>
    <text x="548" y="78">영업</text>
    <text x="596" y="306">총무</text>
    <text x="846" y="82">경영</text>
  </g>

  <g transform="translate(930,64)">
    <rect width="220" height="272" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text class="t" x="18" y="30" font-size="12" fill="#94A3B8" letter-spacing="2">CATALOG</text>
    <line x1="18" y1="42" x2="202" y2="42" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <g class="t cat">
      <circle cx="26" cy="66" r="4" fill="#818CF8"/><text x="40" y="70">연차 잔여일 계산기</text>
      <circle cx="26" cy="100" r="4" fill="#818CF8"/><text x="40" y="104">온보딩 체크리스트</text>
      <circle cx="26" cy="134" r="4" fill="#FB7185"/><text x="40" y="138">면접 질문 생성기</text>
      <circle cx="26" cy="168" r="4" fill="#FBBF24"/><text x="40" y="172">견적 계산기</text>
      <circle cx="26" cy="202" r="4" fill="#2DD4BF"/><text x="40" y="206">비품 반납 점검표</text>
      <circle cx="26" cy="236" r="4" fill="#38BDF8"/><text x="40" y="240">회의록 요약기</text>
    </g>
  </g>

  <g class="t">
    <text x="64" y="330" font-size="40" font-weight="800" fill="#F8FAFC" letter-spacing="-1">KMS Graph</text>
    <text x="66" y="360" font-size="16" fill="#CBD5E1">직원이 만든 웹앱을 그래프와 목록으로 한 장에</text>
  </g>
</svg>
