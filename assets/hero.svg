<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="kms-graph: 그래프와 목록으로 보는 사내 지식 지도">
  <title>kms-graph</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>
  <circle cx="880" cy="200" r="230" fill="url(#glow)"/>

  <!-- left: wordmark + tagline + flow -->
  <text x="72" y="150" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#F8FAFC" letter-spacing="-2">kms<tspan fill="url(#g)">-</tspan>graph</text>
  <text x="74" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#CBD5E1">직원이 만든 웹앱을 그래프와 목록으로 한 장에</text>
  <text x="74" y="228" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">구글시트 · 노션 → 검증 → 정적 페이지 → GitHub Pages → Teams 알림</text>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#E2E8F0">
    <rect x="74" y="262" width="118" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/><text x="133" y="281" text-anchor="middle">하루 1회 자동</text>
    <rect x="202" y="262" width="118" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/><text x="261" y="281" text-anchor="middle">LLM 분류 기록</text>
    <rect x="330" y="262" width="118" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/><text x="389" y="281" text-anchor="middle">HTML 한 파일</text>
  </g>
  <!-- legend -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">
    <polygon points="84,326 94,336 84,346 74,336" fill="url(#g)"/><text x="104" y="341">도메인</text>
    <circle cx="176" cy="336" r="9" fill="#0F172A" stroke="url(#g)" stroke-width="3"/><text x="194" y="341">사이트</text>
    <rect x="258" y="327" width="18" height="18" rx="4" fill="#94A3B8"/><text x="286" y="341">참조데이터</text>
  </g>

  <!-- right: graph -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2">
    <line x1="880" y1="120" x2="800" y2="200"/><line x1="880" y1="120" x2="960" y2="190"/><line x1="880" y1="120" x2="890" y2="250"/>
    <line x1="720" y1="150" x2="800" y2="200"/><line x1="720" y1="150" x2="760" y2="280"/>
    <line x1="1040" y1="140" x2="960" y2="190"/><line x1="1040" y1="140" x2="1050" y2="270"/>
    <line x1="960" y1="190" x2="890" y2="250"/>
    <line x1="800" y1="200" x2="890" y2="250"/>
    <line x1="1050" y1="270" x2="960" y2="330"/><line x1="890" y1="250" x2="960" y2="330"/>
    <line x1="760" y1="280" x2="800" y2="200"/>
  </g>
  <g fill="#94A3B8">
    <rect x="708" y="138" width="24" height="24" rx="5"/>
    <rect x="1028" y="128" width="24" height="24" rx="5"/>
    <rect x="748" y="268" width="24" height="24" rx="5"/>
    <rect x="1038" y="258" width="24" height="24" rx="5"/>
  </g>
  <polygon points="880,96 904,120 880,144 856,120" fill="url(#g)"/>
  <g fill="#0F172A" stroke="url(#g)" stroke-width="4">
    <circle cx="800" cy="200" r="20"/><circle cx="960" cy="190" r="24"/><circle cx="890" cy="250" r="16"/><circle cx="960" cy="330" r="14"/>
  </g>
  <!-- list card -->
  <g transform="translate(560,60)">
    <rect width="150" height="88" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <g fill="#FFFFFF" fill-opacity="0.55">
      <rect x="14" y="16" width="70" height="8" rx="4"/><rect x="14" y="36" width="96" height="8" rx="4"/><rect x="14" y="56" width="58" height="8" rx="4"/>
    </g>
    <g fill="url(#g)"><circle cx="126" cy="20" r="5"/><circle cx="126" cy="40" r="5"/><circle cx="126" cy="60" r="5"/></g>
  </g>
</svg>
