<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120" role="img" aria-label="kms-graph">
  <title>kms-graph</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <!-- mark: domain(diamond) - site(circle) - data(square) -->
  <g fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round">
    <line x1="60" y1="30" x2="60" y2="60"/>
    <line x1="60" y1="60" x2="30" y2="92"/>
    <line x1="60" y1="60" x2="92" y2="92"/>
    <line x1="30" y1="92" x2="92" y2="92" stroke-dasharray="6 6"/>
  </g>
  <g fill="none" stroke="#94A3B8" stroke-width="3">
    <polyline points="97,86 92,92 86,86" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="35,86 30,92 25,86" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <polygon points="60,14 76,30 60,46 44,30" fill="url(#g)"/>
  <circle cx="60" cy="60" r="16" fill="#FFFFFF" stroke="url(#g)" stroke-width="5"/>
  <rect x="18" y="80" width="24" height="24" rx="5" fill="#CBD5E1"/>
  <rect x="80" y="80" width="24" height="24" rx="5" fill="#CBD5E1"/>
  <!-- wordmark -->
  <text x="128" y="66" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#1E293B" letter-spacing="-1">kms<tspan fill="#4F46E5">-</tspan>graph</text>
  <text x="130" y="94" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#64748B">사이트 · 참조데이터 · 도메인을 잇는 KMS 페이지</text>
</svg>
